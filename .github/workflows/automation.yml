
name: The Money Ledger Automation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Download project files
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Gemini library
        run: pip install google-genai

      - name: Create documentary script
        run: python scripts/generate_script.py

      - name: Save generated script
        uses: actions/upload-artifact@v7
        with:
          name: money-ledger-script
          path: output/script.txt
